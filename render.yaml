# Render Blueprint: API + web interface + PostgreSQL.  See docs/render-deployment.md before using.
#
# Values marked "sync: false" are asked for in the Render dashboard on first deploy. Never put
# secrets in this file.
#
# Plan names and prices are the ones I believe Render offers; confirm them in the dashboard.
# The API needs a persistent disk (uploads + vector index), which free instances do not have.

databases:
  - name: apex-db
    plan: basic-256mb
    databaseName: apex
    user: apex

services:
  - type: web
    name: apex-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # 2 GB RAM; 512 MB is too tight (see docs/render-deployment.md)
    numInstances: 1           # the embedded vector store allows exactly one process
    autoDeploy: false
    healthCheckPath: /api/v1/health/ready
    disk:
      name: apex-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: apex-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SETUP_TOKEN
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: VECTOR_STORE_PATH
        value: /var/data/vector_db
      # Render's proxy sits in front of the app; trust its forwarded address so login lockouts
      # count the real client. Only the proxy can reach this service from outside.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  - type: web
    name: apex-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "streamlit run frontend/streamlit_app.py --server.port=${PORT:-10000} --server.address=0.0.0.0"
    plan: starter
    autoDeploy: false
    healthCheckPath: /_stcore/health
    envVars:
      # The API's public address plus /api/v1, e.g. https://apex-api.onrender.com/api/v1
      - key: API_BASE_URL
        sync: false
