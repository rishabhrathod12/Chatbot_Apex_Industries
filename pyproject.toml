[project]
name = "apex-knowledge-assistant"
version = "0.1.0"
description = "Enterprise RAG knowledge assistant for Apex Precision Manufacturing Pvt. Ltd. (fictional)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "openai>=1.40",
    "qdrant-client>=1.12,<2",
    "pyjwt>=2.8",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
frontend = [
    "streamlit>=1.40",
    "httpx>=0.27",
]
# RAGAS evaluation (M13). Install in a SEPARATE venv (.venv-eval), never the app's: ragas pulls
# in langchain and an older openai. The langchain pins keep ragas importable (checked 2026-10-31).
eval = [
    "ragas>=0.4,<0.5",
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.3,<1",
]
dev = [
    "streamlit>=1.40",
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", ".", "frontend"]
addopts = "-m 'not live'"
markers = ["live: calls real external APIs (needs keys); run with -m live"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", ".", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend:frontend"
packages = ["app", "eval"]
modules = ["api_client", "ui", "auth_views", "streamlit_app"]
explicit_package_bases = true

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["I", "UP", "E501"]
"backend/tests/**" = ["F811"]  # a fixture imported from another test file is used by name

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[[tool.mypy.overrides]]
module = ["ragas", "ragas.*", "langchain_openai", "langchain_openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.rag.ingestion.extractors.pdf"]
disallow_untyped_calls = false
