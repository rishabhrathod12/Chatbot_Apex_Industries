[project]
name = "apex-knowledge-assistant"
version = "0.1.0"
description = "Enterprise RAG knowledge assistant for Apex Precision Manufacturing Pvt. Ltd. (fictional)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24,<2",
    "python-docx>=1.1",
    "openai>=1.40",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-m 'not live'"
markers = ["live: calls real external APIs (needs keys); run with -m live"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]
explicit_package_bases = true

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["I", "UP", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.rag.ingestion.extractors.pdf"]
disallow_untyped_calls = false
